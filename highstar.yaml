name: agent-skill-lint
one_liner: Lint agent skills and prompt packs for missing boundaries and risky wording.
target_user: AI agent builders
pain_point: Agent skills often ship without clear scope, safety boundaries, or tests.
demo_command: PYTHONPATH=src python3 -m agent_skill_lint examples/skill.md
tier: baseline
maturity_status: support-aligned-2026-05-31
next_release: v0.1.2
polish_score: 84
topics:
  - ai-tools
  - agent-skills
  - agents
  - prompt-engineering
  - cli
  - developer-tools
release_channel:
  - github
  - relevant-developer-communities
launch_copy:
  - I built agent-skill-lint as a quality gate for multi-harness agent skills and prompt packs.
  - It checks missing boundaries, risky wording, rule IDs, severity, and fix suggestions.
  - Try it with: PYTHONPATH=src python3 -m agent_skill_lint examples/skill.md
quality_gate:
  commands:
    - python3 -m unittest discover -s tests
metrics_goal:
  day_1_stars: 5
  day_3_stars: 15
  day_7_stars: 50
