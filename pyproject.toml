[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-lint"
version = "0.1.0"
description = "Lint agent skills and prompt packs for missing boundaries and risky wording."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "alexzhu0" }]
keywords = ["ai-tools", "agent-skills", "agents", "prompt-engineering", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development"
]

[project.scripts]
agent-skill-lint = "agent_skill_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
